kind = "web"
previewPath = "/landing/"
title = "Clinic OS — Landing Page"
description = "A premium Arabic RTL marketing landing page for Clinic OS, showcasing the platform's features including voice input, WhatsApp integration, smart prescriptions, patient files, online booking, financials, reports, and inventory management."
version = "1.0.0"
id = "artifacts/landing"
router = "path"

[[services]]
name = "web"
paths = [ "/landing/" ]
localPort = 18150

[services.development]
run = "pnpm --filter @workspace/landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18150"
BASE_PATH = "/landing/"
